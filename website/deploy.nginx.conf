# 纸翼官网 + 授权云 同域反代示例
# 域名按实际替换，证书用 certbot / 面板签发。

server {
    listen 443 ssl http2;
    server_name zhiyinb.cc www.zhiyinb.cc;

    # ssl_certificate     /etc/letsencrypt/live/zhiyinb.cc/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zhiyinb.cc/privkey.pem;

    root /var/www/zhiyi-website;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 若官网与授权服务同域，把 API / 管理后台反代到 license-server
    location /auth/ {
        proxy_pass http://127.0.0.1:28180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /license/ {
        proxy_pass http://127.0.0.1:28180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin {
        proxy_pass http://127.0.0.1:28180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://127.0.0.1:28180;
    }
}

server {
    listen 80;
    server_name zhiyinb.cc www.zhiyinb.cc;
    return 301 https://$host$request_uri;
}
